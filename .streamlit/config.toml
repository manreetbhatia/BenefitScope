[theme]
base = "light"
primaryColor = "#1A2820"
backgroundColor = "#E7EEE9"
secondaryBackgroundColor = "#F7FAF8"
textColor = "#1A2820"
borderColor = "#C9D5CD"
linkColor = "#1A2820"
linkUnderline = true
grayColor = "#3E4F46"
redColor = "#9F1D1D"
baseRadius = "none"
buttonRadius = "none"
showWidgetBorder = true
dataframeBorderColor = "#C9D5CD"
dataframeHeaderBackgroundColor = "#D5E0D8"
font = "Libre Franklin:https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
